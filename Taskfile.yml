version: "3"

vars:
  BINARY: opcli{{if eq OS "windows"}}.exe{{end}}
  INSTALL_DIR: "{{.HOME}}/Dropbox/Charlie/bin"
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LAB_NAME: opcli-lab
  LAB_PORT: '{{.LAB_PORT | default "8092"}}'
  LAB_URL: http://localhost:{{.LAB_PORT}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the opcli binary (version from git describe)
    vars:
      # Task-level so a VERSION passed by release/install is honoured
      # (global vars are rendered once, before the tag exists).
      LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} ./cmd/opcli

  lint:
    desc: Format and vet
    cmds:
      - gofmt -s -w .
      - go vet ./...

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  docs:
    desc: Regenerate docs/commands.md from the command registry
    cmds:
      - go run ./cmd/opcli docs > docs/commands.md

  install:
    desc: Build and install opcli to ~/Dropbox/Charlie/bin (on PATH), plus its agent skill
    cmds:
      - task: build
        vars: { VERSION: "{{.VERSION}}" }
      - mkdir -p {{.INSTALL_DIR}}
      - cp {{.BINARY}} {{.INSTALL_DIR}}/{{.BINARY}}
      - "{{.INSTALL_DIR}}/{{.BINARY}} --version"
      # Keep the agent skill in step with the binary.
      - "{{.INSTALL_DIR}}/{{.BINARY}} skill install --force"

  release:
    desc: "Cut a version, publish it and install it: task release V=v0.3.0"
    requires:
      vars: [V]
    preconditions:
      - sh: '[[ "{{.V}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
        msg: "V must look like v1.2.3"
      - sh: test "$(git branch --show-current)" = main
        msg: "Release from main"
      - sh: git diff --quiet && git diff --cached --quiet
        msg: "Working tree not clean: commit first"
      - sh: go run ./cmd/opcli docs | diff -q - docs/commands.md
        msg: "docs/commands.md is stale: run task docs and commit"
    cmds:
      - go vet ./...
      - go test ./...
      - git tag -a {{.V}} -m "{{.V}}"
      # The tag push triggers the GitHub release workflow (goreleaser).
      - git push origin {{.V}}
      # Vars were evaluated before the tag existed: pass the version explicitly.
      - task: install
        vars: { VERSION: '{{trimPrefix "v" .V}}' }

  spec:
    desc: Refresh the embedded OpenAPI spec from the configured server (sanitising the server URL)
    cmds:
      - ./{{.BINARY}} api request GET /api/v3/spec.json -o json | jq -c '.servers = [{"description":"This server","url":"https://openproject.example.com/"}]' | gzip -9 > internal/spec/openapi.json.gz
      - echo "Update spec.EmbeddedVersion in internal/spec/spec.go to the server version (opcli api request GET /api/v3 | jq -r .coreVersion)"

  lab:up:
    desc: "Throwaway OpenProject 17 in Docker for live tests (data is lost on lab:down): task lab:up [LAB_PORT=8092]"
    preconditions:
      - sh: test -z "$(docker ps -aq --filter name=^{{.LAB_NAME}}$)"
        msg: "{{.LAB_NAME}} already exists: task lab:down first"
    cmds:
      # OpenProject 17 reads SECRET_KEY_BASE; with the old OPENPROJECT_ name it crash-loops.
      - docker run -d --name {{.LAB_NAME}} -p 127.0.0.1:{{.LAB_PORT}}:80 -e SECRET_KEY_BASE=$(openssl rand -hex 64) -e OPENPROJECT_HOST__NAME=localhost:{{.LAB_PORT}} -e OPENPROJECT_HTTPS=false -e OPENPROJECT_DEFAULT__LANGUAGE=en openproject/openproject:17
      - |
        echo "Waiting for the API (about a minute)…"
        for i in $(seq 1 60); do
          [ "$(curl -s -o /dev/null -w '%{http_code}' {{.LAB_URL}}/api/v3/projects)" = 401 ] && exit 0
          sleep 5
        done
        echo "API not up after 5 minutes: docker logs {{.LAB_NAME}}" >&2; exit 1
      - |
        key=$(docker exec {{.LAB_NAME}} bash -lc 'cd /app && bundle exec rails runner "puts Token::API.create!(user: User.find_by!(login: %q(admin)), token_name: %q(opcli-lab)).plain_value" 2>/dev/null' | tail -1)
        mkdir -p .lab
        go run ./cmd/opcli config init --url {{.LAB_URL}} --api-key "$key" --project demo-project --file .lab/opcli.yaml
      - 'echo "Lab ready: opcli --config .lab/opcli.yaml … (UI {{.LAB_URL}}, admin/admin)"'

  lab:down:
    desc: Remove the lab container and its config
    cmds:
      - docker rm -f {{.LAB_NAME}}
      - rm -rf .lab

  clean:
    desc: Remove built binary
    cmds:
      - rm -f {{.BINARY}}
