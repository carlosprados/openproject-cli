version: "3"

vars:
  BINARY: opcli{{if eq OS "windows"}}.exe{{end}}
  INSTALL_DIR: "{{.HOME}}/Dropbox/Charlie/bin"
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the opcli binary (version from git describe)
    vars:
      # Task-level so a VERSION passed by release/install is honoured
      # (global vars are rendered once, before the tag exists).
      LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} ./cmd/opcli

  lint:
    desc: Format and vet
    cmds:
      - gofmt -s -w .
      - go vet ./...

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  docs:
    desc: Regenerate docs/commands.md from the command registry
    cmds:
      - go run ./cmd/opcli docs > docs/commands.md

  install:
    desc: Build and install opcli to ~/Dropbox/Charlie/bin (on PATH)
    cmds:
      - task: build
        vars: { VERSION: "{{.VERSION}}" }
      - mkdir -p {{.INSTALL_DIR}}
      - cp {{.BINARY}} {{.INSTALL_DIR}}/{{.BINARY}}
      - "{{.INSTALL_DIR}}/{{.BINARY}} --version"

  release:
    desc: "Cut a version, publish it and install it: task release V=v0.3.0"
    requires:
      vars: [V]
    preconditions:
      - sh: '[[ "{{.V}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
        msg: "V must look like v1.2.3"
      - sh: test "$(git branch --show-current)" = main
        msg: "Release from main"
      - sh: git diff --quiet && git diff --cached --quiet
        msg: "Working tree not clean: commit first"
      - sh: go run ./cmd/opcli docs | diff -q - docs/commands.md
        msg: "docs/commands.md is stale: run task docs and commit"
    cmds:
      - go vet ./...
      - go test ./...
      - git tag -a {{.V}} -m "{{.V}}"
      # The tag push triggers the GitHub release workflow (goreleaser).
      - git push origin {{.V}}
      # Vars were evaluated before the tag existed: pass the version explicitly.
      - task: install
        vars: { VERSION: '{{trimPrefix "v" .V}}' }

  spec:
    desc: Refresh the embedded OpenAPI spec from the configured server (sanitising the server URL)
    cmds:
      - ./{{.BINARY}} api request GET /api/v3/spec.json -o json | jq -c '.servers = [{"description":"This server","url":"https://openproject.example.com/"}]' | gzip -9 > internal/spec/openapi.json.gz
      - echo "Update spec.EmbeddedVersion in internal/spec/spec.go to the server version (opcli api request GET /api/v3 | jq -r .coreVersion)"

  clean:
    desc: Remove built binary
    cmds:
      - rm -f {{.BINARY}}
